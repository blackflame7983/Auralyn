<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Auralyn</title>
  <desc id="desc">Auralyn のワードマークと、シアンから紫へ流れる音声の波形。Realtime audio, shaped by you.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111024"/></linearGradient>
    <linearGradient id="signal" x1="570" y1="120" x2="1150" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#78C4F7"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="rule" x1="62" y1="0" x2="1138" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0.1"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6245A7" stop-opacity="0.2"/><stop offset="1" stop-color="#6245A7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.045"/></pattern>
    <clipPath id="bounds"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="360" fill="url(#surface)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="930" cy="175" rx="390" ry="310" fill="url(#glow)"/>
    <path d="M570 185H610C639 185 638 156 657 156S675 219 696 219S717 102 739 102S761 260 784 260S807 69 833 69S856 277 880 277S903 108 928 108S950 237 974 237S996 145 1018 145S1040 198 1060 198S1080 185 1100 185H1140" stroke="url(#signal)" stroke-width="16" stroke-linecap="round" opacity="0.045"/>
    <path d="M570 185H610C639 185 638 156 657 156S675 219 696 219S717 102 739 102S761 260 784 260S807 69 833 69S856 277 880 277S903 108 928 108S950 237 974 237S996 145 1018 145S1040 198 1060 198S1080 185 1100 185H1140" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <path d="M570 185H1140" stroke="#94A3B8" stroke-opacity="0.15" stroke-dasharray="2 8"/>
    <circle cx="833" cy="69" r="5" fill="#78C4F7"/>
    <circle cx="880" cy="277" r="4" fill="#A78BFA"/>
    <text x="62" y="83" fill="#A5B4C9" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="4">YOUR VOICE. YOUR SIGNAL.</text>
    <text x="58" y="192" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="92" font-weight="650" letter-spacing="-4">Aura<tspan fill="#67E8F9">lyn</tspan></text>
    <text x="64" y="235" fill="#B8C4D8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Realtime audio, shaped by you.</text>
    <path d="M64 291H1136" stroke="url(#rule)"/>
    <text x="64" y="324" fill="#8FA4BF" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">MIC IN</text>
    <text x="350" y="324" fill="#8FA4BF" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">SHAPE</text>
    <text x="650" y="324" fill="#8FA4BF" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">LISTEN</text>
    <text x="1048" y="324" fill="#8FA4BF" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">STREAM</text>
    <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" stroke="#8294B5" stroke-opacity="0.15"/>
