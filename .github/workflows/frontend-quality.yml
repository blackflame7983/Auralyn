name: Frontend quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit and DOM tests
        run: npm test -- --run --maxWorkers=4
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Frontend build
        run: npx vite build
      - name: Distribution script tests
        run: npm run test:release
      - name: Release policy
        run: npm run release:check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser tests (IPC mock)
        run: npx playwright test --output=ci-artifacts/browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/browser
          if-no-files-found: ignore
          retention-days: 7
