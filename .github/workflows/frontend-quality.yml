name: Frontend quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Python static analyzer
        run: python -m pip install --target node_modules/.cache/auralyn-python -r requirements-dev.txt
      - name: Deterministic verification
        run: npm run verify -- --full
      - name: Preserve verification failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/gardening
          if-no-files-found: ignore
          retention-days: 7

  # ブラウザ試験は全件を4台に分けて並べて回す。分けても全件を回すことは変わらない。
  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Frontend build
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser tests (IPC mock)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --output=ci-artifacts/browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-browser-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ci-artifacts/browser
          if-no-files-found: ignore
          retention-days: 7

  # 既存の必須チェック名を保ち、片方の失敗・取消・skipを成功扱いにしない。
  frontend:
    if: always()
    needs: [checks, browser]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require both quality jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if ($env:CHECKS_RESULT -ne 'success' -or $env:BROWSER_RESULT -ne 'success') {
            Write-Error "Frontend quality did not pass: checks=$env:CHECKS_RESULT, browser=$env:BROWSER_RESULT"
            exit 1
          }
