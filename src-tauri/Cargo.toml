[package]
name = "vst-host"
version = "1.1.0"
description = "リアルタイム音声処理特化型の軽量VST3ホストアプリケーション"
authors = ["kuro7983"]
publish = false
license = "GPL-3.0-only"
edition = "2021"
default-run = "AuralynHost"

[[bin]]
name = "AuralynHost"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vst_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["image-png", "image-ico", "tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.17.3", features = ["asio"] }
anyhow = "1.0.100"
log = "0.4.29"
env_logger = "0.11.8"
vst3 = "0.3.0"
walkdir = "2.5.0"
ringbuf = "0.5.3"
libloading = "0.9.0"
windows = { version = "0.62.2", features = ["ApplicationModel", "Storage_Search", "Security_Authorization_AppCapabilityAccess", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Rpc", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Enumeration", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage"] }
# サポート対象は Windows 11 x64。Linux用の既定描画機能は有効化しない。
winit = { version = "0.29.15", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
open = "5.3.3"
tauri-plugin-window-state = "2.5.0"
base64 = "0.21"
obws = { version = "0.11", features = ["events"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
winreg = "0.52"
rubato = "0.14"
nnnoiseless = { version = "=0.5.2", path = "../third_party/nnnoiseless-0.5.2", default-features = false }
hound = "3.5.1"
rustfft = "6.2.0"
rfd = "0.17.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-mcp-bridge = "0.13.1"


[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }
nnnoiseless_reference = { package = "nnnoiseless", version = "=0.5.2", default-features = false }
serde_json = "1"
assert_cmd = "2"
# assert_cmd = "2" # Optional, if we want easier process testing, but std::process is fine for now to avoid extra deps download time

# 検証用exampleだけで参照版と割当計測器を有効にする。通常の配布では指定しない。
[features]
dsp-verification = ["dep:nnnoiseless_reference"]

[dependencies.nnnoiseless_reference]
package = "nnnoiseless"
version = "=0.5.2"
default-features = false
optional = true

[[example]]
name = "dsp_abort_verification"
required-features = ["dsp-verification"]

[[example]]
name = "dsp_performance"
path = "examples/dsp_benchmark/timing.rs"

[[example]]
name = "dsp_retained_memory"
path = "examples/dsp_benchmark/memory.rs"

# --- Build Profile Optimizations ---

# Optimize dependencies even in dev builds to speed up engine startup/audio processing
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true        # Link Time Optimization (smaller binary, faster code)
panic = "abort"   # Remove unwind tables (smaller binary)
# strip = true    # Windows Defenderの誤検知(トロイの木馬判定)を軽減するためデバッグシンボルを残す

[patch.crates-io]
# 固定版のASIO build失敗時に、data/message callback登録を対で回収する。
cpal = { path = "../third_party/cpal-0.17.3" }
