<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <style>
      html { background: hsl(0 0% 100%); color: hsl(222.2 84% 4.9%); color-scheme: light; }
      html.dark { background: hsl(222 47% 6%); color: hsl(210 40% 96%); color-scheme: dark; }
      html.gaming { background: hsl(240 10% 3%); color: hsl(0 0% 98%); color-scheme: dark; }
    </style>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('vst_host_theme'); } catch (_) { /* 保存値を読めないときは OS の設定へ戻す。 */ }
        if (!['light', 'dark', 'gaming'].includes(theme)) {
          try { theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
          catch (_) { theme = 'dark'; }
        }
        document.documentElement.className = theme === 'gaming' ? 'dark gaming' : theme;
      })();
    </script>
    <title>Auralyn</title>
    <link rel="icon" type="image/png" href="/auralyn_icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
