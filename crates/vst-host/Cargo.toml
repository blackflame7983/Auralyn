[package]
name = "vst-host"
version = "1.1.0"
description = "リアルタイム音声処理特化型の軽量VST3ホストアプリケーション"
authors = ["kuro7983"]
publish = false
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.100"

[lib]
name = "vst_host_lib"

[dependencies]
auralyn-core = { path = "../auralyn-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
cpal = { version = "0.17.3", features = ["asio"] }
anyhow = "1.0.100"
log = "0.4.29"
env_logger = "0.11.8"
vst3 = "0.3.0"
walkdir = "2.5.0"
windows-core = "=0.62.2"
ringbuf = "0.5.3"
libloading = "0.9.0"
windows = { version = "0.62.2", features = ["ApplicationModel", "Storage_Search", "Security_Authorization_AppCapabilityAccess", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Rpc", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Enumeration", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp"] }
# サポート対象は Windows 11 x64。Linux用の既定描画機能は有効化しない。
winit = { version = "0.29.15", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
base64 = "0.21"
obws = { version = "0.11", features = ["events"] }
time = "0.3"
tokio = { version = "1.51.6", features = ["full"] }
futures-util = "0.3"
winreg = "0.52"
rubato = "0.14"
nnnoiseless = { version = "=0.5.2", path = "../../third_party/nnnoiseless-0.5.2", default-features = false }
hound = "3.5.1"
rustfft = "6.2.0"


[dev-dependencies]
nnnoiseless_reference = { package = "nnnoiseless", version = "=0.5.2", default-features = false }
serde_json = "1"
assert_cmd = "2"
# assert_cmd = "2" # Optional, if we want easier process testing, but std::process is fine for now to avoid extra deps download time

# 検証用exampleだけで参照版と割当計測器を有効にする。通常の配布では指定しない。
[features]
dsp-verification = ["dep:nnnoiseless_reference"]

# 隔離probeのビルドは明示的に有効にする。必要なAPIは製品入力でも使用する。
process-loopback-probe = []
post-mix-verification = []

[[example]]
name = "process_loopback_probe"
required-features = ["process-loopback-probe"]

[dependencies.nnnoiseless_reference]
package = "nnnoiseless"
version = "=0.5.2"
default-features = false
optional = true

[[example]]
name = "dsp_abort_verification"
required-features = ["dsp-verification"]

[[example]]
name = "dsp_performance"
path = "examples/dsp_benchmark/timing.rs"

[[example]]
name = "dsp_retained_memory"
path = "examples/dsp_benchmark/memory.rs"

[[example]]
name = "post_mix_verification"
test = false
required-features = ["post-mix-verification"]

[[example]]
name = "crash_vst3"
crate-type = ["cdylib"]
test = false

[lints.clippy]
await_holding_lock = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"
