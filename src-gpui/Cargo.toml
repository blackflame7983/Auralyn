[package]
name = "auralyn-gpui"
version.workspace = true
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Auralyn の画面（GPUI）"
rust-version = "1.100"

[[bin]]
name = "auralyn-gpui"
path = "src/main.rs"

[dependencies]
vst-host = { path = "../crates/vst-host" }
auralyn-core = { path = "../crates/auralyn-core" }
auralyn-ui-model = { path = "../crates/auralyn-ui-model" }
gpui-kit = "0.11.0"
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
flume = "0.11"
# OBS との接続（vst-host の obs）を動かす。版は vst-host と同じ。
tokio = { version = "1.51.6", features = ["rt-multi-thread"] }

# Windows だけで使う。
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
global-hotkey = "0.7"
# 窓の × でトレイへ隠す（GPUI に窓を隠す手段が無いので、Win32 の ShowWindow を使う）。版は GPUI と tray-icon が使うものに揃える。
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

# 窓・タスクバー・トレイのアイコンを実行ファイルに入れる。
[build-dependencies]
embed-resource = "3.0.6"

[lints.clippy]
await_holding_lock = "deny"
